name: persianvlm-local
x-argilla-env: &argilla-env
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Run ./local.sh start}@postgres:5432/argilla
  ARGILLA_REDIS_URL: redis://redis:6379/0
  ARGILLA_AUTH_SECRET_KEY: ${ARGILLA_AUTH_SECRET_KEY:?Run ./local.sh start}
  HF_HUB_DISABLE_TELEMETRY: "1"
services:
  postgres:
    image: postgres:14.17
    restart: unless-stopped
    environment:
      POSTGRES_DB: argilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d argilla"]
      interval: 5s
      timeout: 5s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m -XX:UseSVE=0
      CLI_JAVA_OPTS: -XX:UseSVE=0
    volumes: ["elastic:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  argilla:
    image: persianvlm-local-argilla:v0.1.0
    build: ./argilla
    restart: unless-stopped
    environment:
      <<: *argilla-env
      USERNAME: owner
      PASSWORD: ${OWNER_PASSWORD:?Run ./local.sh start}
      API_KEY: ${OWNER_API_KEY:?Run ./local.sh start}
      WORKSPACE: local
    volumes: ["argilla:/var/lib/argilla"]
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6900/api/status', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
  worker:
    image: persianvlm-local-argilla:v0.1.0
    build: ./argilla
    restart: unless-stopped
    environment: *argilla-env
    command: ["sh", "-c", "python -m argilla_server worker --num-workers 1"]
    volumes: ["argilla:/var/lib/argilla"]
    depends_on:
      argilla: {condition: service_healthy}
  local:
    build: ./app
    restart: unless-stopped
    environment:
      ARGILLA_URL: http://argilla:6900
      DATA_DIR: /data
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports: ["127.0.0.1:${LOCAL_PORT:-6900}:8080"]
    volumes: ["local:/data"]
    depends_on:
      argilla: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/local/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
volumes:
  postgres:
  elastic:
  redis:
  argilla:
  local:
